<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <title>

        {% block title %}

        {% endblock %}

    </title>

    <!-- css dùng chung -->
    <link rel="stylesheet" href="{{ url_for('static',
          filename='css/common.css') }}">

    <!-- css cho chat    -->
    <link rel="stylesheet" href="{{ url_for('static',filename='css/chat.css') }}">

    <!-- css riêng từng trang -->
    {% block css %}

    {% endblock %}

</head>

<body>

    <nav class="navbar" aria-label="Điều hướng chính">

        <a class="brand" href="{{ url_for('predict_csv.home') }}">
            <span class="brand-mark" aria-hidden="true">+</span>
            <span>Diabetes Care</span>
        </a>

        <div class="nav-links">

            <a class="nav-link" href="{{ url_for('predict_csv.home') }}">
                Dự đoán
            </a>

            <a class="nav-link" href="{{ url_for('report_csv.show_reports') }}">
                Báo cáo Train
            </a>

            <a class="nav-link" href="{{ url_for('predict_image.home') }}">
                dự đoán hình ảnh
            </a>
            <a class="nav-link" href="{{ url_for('search_image.search') }}">
                tìm kiếm hình ảnh tương tự
            </a>

        </div>
    </nav>

    <main class="page-shell">
        {% block content %}

        {% endblock %}
    </main>

    <!-- tích hợp icon chat vào-->
    {% include "components/chat_widget.html" %}
    <!-- script cho chat-->
    <script src="{{ url_for('static',filename='js/chat.js') }}"></script>
</body>

</html>
