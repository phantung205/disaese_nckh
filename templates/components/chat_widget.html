<!-- Nút chat -->
<div id="chat-toggle" role="button" tabindex="0" aria-label="Mở trợ lý y khoa">
    💬
</div>

<!-- Hộp chat -->
<div id="chat-container" role="dialog" aria-label="Trợ lý y khoa">
    <div id="chat-header">
        <span>Medical ChatBot</span>
        <div>
            <button id="clear-chat">
                🗑
            </button>
            <button id="chat-close">
                ✖
            </button>
        </div>
    </div>

    <div id="chat-messages">


    </div>

    <div id="chat-input-area">

        <!-- Preview ảnh đã chọn -->
        <div id="selected-image-preview"></div>

        <input type="file" id="chat-image" accept="image/png,image/jpeg,image/webp" hidden>

        <button id="image-btn" type="button">
            📎
        </button>

        <input id="chat-input" type="text" placeholder="Nhập câu hỏi hoặc mô tả ảnh...">

        <button id="send-btn" type="button">
            Gửi
        </button>

    </div>

</div>
